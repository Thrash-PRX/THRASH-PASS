<!doctype html><html><head><meta charset="utf-8"><title>THRASH-PASS</title><style>
body{margin:0;padding:16px;width:360px;background:#0d0d10;color:#eee;font:14px system-ui;box-sizing:border-box}h2{margin:0 0 12px}label{display:block;margin:10px 0 5px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #333;border-radius:8px;background:#17171c;color:#fff}button{margin-top:12px;padding:9px 12px;border:0;border-radius:8px;cursor:pointer}#save{background:#fff}#test,#refreshModels{background:#2a2a31;color:#fff}.status{margin-top:10px;font-size:12px;white-space:pre-wrap}.hint{opacity:.65;font-size:11px;margin-top:8px}a{color:#8ab4ff}button:disabled,input:disabled{opacity:.5;cursor:not-allowed}.mode{margin:14px 0 4px;padding:11px;border:1px solid #303038;border-radius:9px;background:#15151a}.mode label{display:flex;align-items:center;gap:9px;margin:0;font-weight:650}.mode input{width:auto;margin:0}.mode small{display:block;margin-top:6px;opacity:.7;line-height:1.35}
</style></head><body><h2>THRASH-PASS</h2><div class="mode"><label><input id="presentationMode" type="checkbox"> Presentation Mode</label><small>When enabled, THRASH-PASS stays inactive on webpages: no overlay, editor targeting, screenshot, auto-paste, context-menu assistant, or page shortcut. Refresh already-open pages once after changing this mode.</small></div><label>Provider</label><select id="provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="kimi">Kimi / Moonshot</option><option value="custom">Custom OpenAI-compatible</option></select><label>API key</label><input id="apiKey" type="password" autocomplete="off" placeholder="Paste your API key"><label>Model</label><input id="model" list="modelList" placeholder="gemini-3.8-flash"><datalist id="modelList"></datalist><button id="refreshModels">Refresh Gemini models</button><label>Custom endpoint (optional)</label><input id="endpoint" placeholder="https://.../v1/chat/completions"><button id="save">Save settings</button><button id="test">Test connection</button><div id="status" class="status"></div><div class="hint">Gemini: <a href="https://aistudio.google.com/apikey" target="_blank">Get an API key</a>. Current default: <b>gemini-3.8-flash</b>.</div><script src="popup.js"></script></body></html>
