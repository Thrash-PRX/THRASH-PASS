name: Build Windows updater

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'extension/**'
      - 'scripts/test-auto-reload.mjs'
      - 'tests/**'
      - '.github/workflows/windows-updater.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: .\windows\build.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension regression tests
        run: npm test
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install chromium
      - name: Verify automatic extension reload in isolated Chromium profile
        run: npm run test:browser
      - name: Test installation and automatic updates in disposable Windows VM
        shell: powershell
        run: .\windows\sandbox-test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: THRASH-PASS-Windows-Updater
          path: |
            windows/dist/THRASH-PASS-Updater.exe
            windows/dist/sandbox-results.json
            windows/dist/updater.log
            output/playwright/auto-reload-results.json
