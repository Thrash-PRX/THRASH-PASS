name: Build Windows updater

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-updater.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: .\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: THRASH-PASS-Windows-Updater
          path: windows/dist/THRASH-PASS-Updater.exe
